[package]
name = "bareboot-desktop"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
dirs = "6"
ffmpeg-next = "9"
futures = "0.3"
gpui-kit = { version = "0.10.0", default-features = false }
lz4_flex = { version = "0.14", default-features = false, features = ["std"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "process", "io-util", "macros"] }
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CATransaction", "objc2-core-foundation"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
glow = "0.16"
glutin = "0.32"
glutin-winit = "0.5"
